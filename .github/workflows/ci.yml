name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입·lint·단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # 버전은 package.json 의 packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: 브라우저 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 빈 DB에 마이그레이션을 처음부터 적용한다 (supabase/config.toml 의 553xx 포트)
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start -x imgproxy,edge-runtime,logflare,vector,supavisor,studio
      - name: 웹 환경 변수 (로컬 Supabase 키)
        run: |
          cp apps/web/.env.example apps/web/.env.local
          key=$(supabase status -o json | jq -r .PUBLISHABLE_KEY)
          sed -i "s|^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=.*|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key|" apps/web/.env.local

      # 러너에 설치된 Chrome 을 쓴다 (channel: "chrome"). 개발 서버는 Playwright 가 띄운다.
      - run: pnpm e2e
        env:
          E2E_WORKERS: 2

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
